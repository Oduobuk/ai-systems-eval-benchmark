[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-systems-eval-benchmark"
version = "0.1.0"
description = "Automated evaluation & rubric benchmark suite assessing frontier LLMs on GPU systems, CUDA & inference reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

